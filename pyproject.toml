[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioeval"
version = "0.2.0"
description = "Runnable evaluation protocols for biological machine learning: group-aware splits, leakage auditing, and bootstrap confidence intervals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Daniel González Lozano", email = "sleepy.komodo@protonmail.com" }]
keywords = ["machine learning", "bioinformatics", "model evaluation", "data leakage",
            "cluster-aware splits", "bootstrap confidence intervals", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
examples = ["scikit-learn>=1.3", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/GDanielGzz/bio-ml-eval-protocols"
Source = "https://github.com/GDanielGzz/bio-ml-eval-protocols"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: runs the example scripts end to end (~1 min)"]
